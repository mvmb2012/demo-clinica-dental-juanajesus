<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MIM — Clínica Dental Juana Jesús</title>
<style>
  :root{
    --wa-header:#075E54;
    --wa-bg:#E5DDD5;
    --wa-green:#DCF8C6;
    --wa-white:#FFFFFF;
    --wa-text:#111B21;
    --wa-sub:#667781;
    --wa-tick:#53BDEB;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:#0b141a;
    display:flex;
    justify-content:center;
    padding:24px 12px;
    min-height:100vh;
  }
  .phone{
    width:390px;
    max-width:100%;
    background:var(--wa-bg);
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 0 0 8px #1b1b1b, 0 20px 50px rgba(0,0,0,.5);
    display:flex;
    flex-direction:column;
    height:780px;
    position:relative;
  }
  .notch{
    position:absolute;
    top:0; left:50%; transform:translateX(-50%);
    width:150px; height:24px;
    background:#1b1b1b;
    border-radius:0 0 16px 16px;
    z-index:20;
  }
  .header{
    background:var(--wa-header);
    color:#fff;
    padding:44px 10px 12px 10px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .header .back{ font-size:22px; padding:0 4px; opacity:.9; }
  .avatar{
    width:38px;height:38px;border-radius:50%;
    background:#0d7d70;
    display:flex;align-items:center;justify-content:center;
    font-weight:600;font-size:14px;color:#fff;
    flex-shrink:0;
  }
  .header-info{ line-height:1.25; flex:1; min-width:0; }
  .header-info .name{ font-size:16px; font-weight:600; }
  .header-info .status{ font-size:12px; opacity:.85; }
  .header-icons{ display:flex; gap:18px; font-size:18px; opacity:.95; padding-right:2px; }

  .chatarea{
    flex:1;
    overflow-y:auto;
    padding:14px 10px;
    background-image:
      linear-gradient(rgba(229,221,213,.92), rgba(229,221,213,.92)),
      repeating-linear-gradient(45deg, rgba(0,0,0,.02) 0 2px, transparent 2px 40px);
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .daychip{
    align-self:center;
    background:#E1F3FB;
    color:#54656F;
    font-size:12px;
    padding:5px 10px;
    border-radius:8px;
    margin:8px 0;
  }
  .bubble-row{ display:flex; margin:2px 0; }
  .bubble-row.out{ justify-content:flex-end; }
  .bubble{
    max-width:78%;
    padding:6px 8px 7px 9px;
    border-radius:8px;
    font-size:14.5px;
    line-height:1.35;
    color:var(--wa-text);
    position:relative;
    box-shadow:0 1px 0.5px rgba(0,0,0,.13);
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .bubble.in{ background:var(--wa-white); border-top-left-radius:0; }
  .bubble.out{ background:var(--wa-green); border-top-right-radius:0; }
  .meta{
    display:block;
    text-align:right;
    font-size:10.5px;
    color:var(--wa-sub);
    margin-top:3px;
  }
  .meta .tick{ color:var(--wa-tick); margin-left:3px; }
  .typing{
    display:flex; gap:4px; align-items:center;
    background:var(--wa-white);
    padding:9px 12px;
    border-radius:8px;
    border-top-left-radius:0;
    width:fit-content;
    box-shadow:0 1px 0.5px rgba(0,0,0,.13);
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:#a8b0b5;
    animation:blink 1.2s infinite;
  }
  .typing span:nth-child(2){ animation-delay:.2s; }
  .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,60%,100%{opacity:.3;} 30%{opacity:1;} }

  .inputbar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 8px 14px 8px;
    background:#EFEAE4;
    flex-shrink:0;
  }
  .inputbar input{
    flex:1;
    border:none;
    outline:none;
    padding:10px 14px;
    border-radius:22px;
    font-size:14.5px;
    background:#fff;
  }
  .sendbtn{
    width:38px;height:38px;border-radius:50%;
    background:var(--wa-header);
    border:none;
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .sendbtn:disabled{ opacity:.5; }

  .quickchips{
    display:flex; gap:6px; overflow-x:auto;
    padding:0 8px 8px 8px;
    background:#EFEAE4;
  }
  .chip{
    flex-shrink:0;
    background:#fff;
    border:1px solid #d8d2c9;
    color:#075E54;
    font-size:12px;
    padding:6px 11px;
    border-radius:14px;
    cursor:pointer;
  }
  .chip:active{ background:#f0f0f0; }

  .scenariobar{
    max-width:390px;
    margin:0 auto 10px auto;
    color:#c6cdd2;
    font-size:12px;
    text-align:center;
  }
  .chatarea::-webkit-scrollbar{ width:5px; }
  .chatarea::-webkit-scrollbar-thumb{ background:rgba(0,0,0,.15); border-radius:4px; }
</style>
</head>
<body>

<div style="display:flex; flex-direction:column; align-items:center;">
<div class="phone">
  <div class="notch"></div>
  <div class="header">
    <span class="back">&#8592;</span>
    <div class="avatar">MIM</div>
    <div class="header-info">
      <div class="name">MIM · Clínica Dental Juana Jesús</div>
      <div class="status" id="statusline">en línea</div>
    </div>
    <div class="header-icons">
      <span>&#128222;</span>
      <span>&#8942;</span>
    </div>
  </div>

  <div class="chatarea" id="chatarea">
    <div class="daychip">HOY</div>
  </div>

  <div class="quickchips" id="quickchips">
    <div class="chip" data-msg="Hola, quiero pedir cita">Pedir cita</div>
    <div class="chip" data-msg="¿Qué horarios tenéis libres esta semana?">Ver disponibilidad</div>
    <div class="chip" data-msg="Necesito cancelar mi cita">Cancelar cita</div>
    <div class="chip" data-msg="¿Cuánto cuesta un implante?">Precio implante</div>
  </div>

  <div class="inputbar">
    <input type="text" id="msgInput" placeholder="Escribe un mensaje" autocomplete="off">
    <button class="sendbtn" id="sendBtn" aria-label="Enviar">&#10148;</button>
  </div>
</div>
<div class="scenariobar">Demo conectada a n8n · IA en vivo · agenda de prueba</div>
</div>

<script>
// ⚠️ CAMBIA ESTA URL por la Production URL real de tu webhook "Webhook Demo Web" en n8n
const N8N_WEBHOOK_URL = 'https://mmaisystem.app.n8n.cloud/webhook/1655834e-3d5c-43fe-bb40-9a2dbcd562ed';

const chatarea = document.getElementById('chatarea');
const input = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const statusline = document.getElementById('statusline');
const quickchips = document.getElementById('quickchips');

// Identificador único por sesión de navegador, para que n8n mantenga la memoria de esta conversación
const sessionPhone = 'demo-' + Math.random().toString(36).slice(2, 10);
let firstUserMessage = true;

function timeNow(){
  return new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
}

function scrollToBottom(){ chatarea.scrollTop = chatarea.scrollHeight; }

function addBubble(text, who){
  const row = document.createElement('div');
  row.className = 'bubble-row ' + (who === 'out' ? 'out' : 'in');
  const b = document.createElement('div');
  b.className = 'bubble ' + (who === 'out' ? 'out' : 'in');
  b.textContent = text;
  const meta = document.createElement('span');
  meta.className = 'meta';
  meta.innerHTML = timeNow() + (who === 'out' ? '<span class="tick">&#10003;&#10003;</span>' : '');
  b.appendChild(meta);
  row.appendChild(b);
  chatarea.appendChild(row);
  scrollToBottom();
}

function showTyping(){
  const row = document.createElement('div');
  row.className = 'bubble-row in';
  row.id = 'typingRow';
  const t = document.createElement('div');
  t.className = 'typing';
  t.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(t);
  chatarea.appendChild(row);
  scrollToBottom();
}

function hideTyping(){
  const t = document.getElementById('typingRow');
  if(t) t.remove();
}

async function callN8N(userText){
  try{
    const response = await fetch(N8N_WEBHOOK_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        mensaje: userText,
        telefono: sessionPhone,
        nombre: ''
      })
    });
    if(!response.ok){
      return 'No he podido conectar con el asistente ahora mismo (código ' + response.status + '). Revisa que el flujo de n8n esté activo.';
    }
    const data = await response.json();
    return data.respuesta || 'Perdona, ¿puedes repetirlo? 🙏';
  }catch(err){
    return 'No he podido conectar con el asistente. Comprueba la URL del webhook y que el flujo esté activo en n8n.';
  }
}

async function sendMessage(text){
  if(!text || !text.trim()) return;
  input.value = '';
  sendBtn.disabled = true;

  if(firstUserMessage){
    quickchips.style.display = 'none';
    firstUserMessage = false;
  }

  addBubble(text, 'out');
  statusline.textContent = 'escribiendo…';
  showTyping();

  const reply = await callN8N(text);

  hideTyping();
  addBubble(reply, 'in');
  statusline.textContent = 'en línea';
  sendBtn.disabled = false;
}

sendBtn.addEventListener('click', () => sendMessage(input.value));
input.addEventListener('keydown', (e) => { if(e.key === 'Enter') sendMessage(input.value); });

quickchips.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => sendMessage(chip.getAttribute('data-msg')));
});

setTimeout(() => {
  addBubble('¡Hola! 😊 Soy MIM, el asistente de Clínica Dental Juana Jesús. Para poder ayudarte, ¿me dices tu nombre y apellidos completos?', 'in');
}, 500);
</script>

</body>
</html>
