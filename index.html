<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MIM — Clínica Dental Juana Jesús</title>
<style>
  :root{
    --wa-header:#075E54;
    --wa-bg:#E5DDD5;
    --wa-green:#DCF8C6;
    --wa-white:#FFFFFF;
    --wa-text:#111B21;
    --wa-sub:#667781;
    --wa-tick:#53BDEB;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:#0b141a;
    display:flex;
    justify-content:center;
    padding:24px 12px;
    min-height:100vh;
  }
  .phone{
    width:390px;
    max-width:100%;
    background:var(--wa-bg);
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 0 0 8px #1b1b1b, 0 20px 50px rgba(0,0,0,.5);
    display:flex;
    flex-direction:column;
    height:780px;
    position:relative;
  }
  .notch{
    position:absolute;
    top:0; left:50%; transform:translateX(-50%);
    width:150px; height:24px;
    background:#1b1b1b;
    border-radius:0 0 16px 16px;
    z-index:20;
  }
  .header{
    background:var(--wa-header);
    color:#fff;
    padding:44px 10px 12px 10px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .header .back{ font-size:22px; padding:0 4px; opacity:.9; }
  .avatar{
    width:38px;height:38px;border-radius:50%;
    background:#0d7d70;
    display:flex;align-items:center;justify-content:center;
    font-weight:600;font-size:14px;color:#fff;
    flex-shrink:0;
  }
  .header-info{ line-height:1.25; flex:1; min-width:0; }
  .header-info .name{ font-size:16px; font-weight:600; }
  .header-info .status{ font-size:12px; opacity:.85; }
  .header-icons{ display:flex; gap:18px; font-size:18px; opacity:.95; padding-right:2px; }

  .chatarea{
    flex:1;
    overflow-y:auto;
    padding:14px 10px;
    background-image:
      linear-gradient(rgba(229,221,213,.92), rgba(229,221,213,.92)),
      repeating-linear-gradient(45deg, rgba(0,0,0,.02) 0 2px, transparent 2px 40px);
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .daychip{
    align-self:center;
    background:#E1F3FB;
    color:#54656F;
    font-size:12px;
    padding:5px 10px;
    border-radius:8px;
    margin:8px 0;
  }
  .bubble-row{ display:flex; margin:2px 0; }
  .bubble-row.out{ justify-content:flex-end; }
  .bubble{
    max-width:78%;
    padding:6px 8px 7px 9px;
    border-radius:8px;
    font-size:14.5px;
    line-height:1.35;
    color:var(--wa-text);
    position:relative;
    box-shadow:0 1px 0.5px rgba(0,0,0,.13);
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .bubble.in{ background:var(--wa-white); border-top-left-radius:0; }
  .bubble.out{ background:var(--wa-green); border-top-right-radius:0; }
  .meta{
    display:block;
    text-align:right;
    font-size:10.5px;
    color:var(--wa-sub);
    margin-top:3px;
  }
  .meta .tick{ color:var(--wa-tick); margin-left:3px; }
  .sysnote{
    align-self:center;
    background:rgba(255,255,255,.7);
    border:1px dashed #b9c2b0;
    color:#4b5d4f;
    font-size:11px;
    padding:4px 10px;
    border-radius:8px;
    margin:6px 0;
    text-align:center;
    max-width:88%;
  }
  .typing{
    display:flex; gap:4px; align-items:center;
    background:var(--wa-white);
    padding:9px 12px;
    border-radius:8px;
    border-top-left-radius:0;
    width:fit-content;
    box-shadow:0 1px 0.5px rgba(0,0,0,.13);
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:#a8b0b5;
    animation:blink 1.2s infinite;
  }
  .typing span:nth-child(2){ animation-delay:.2s; }
  .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,60%,100%{opacity:.3;} 30%{opacity:1;} }

  .inputbar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 8px 14px 8px;
    background:#EFEAE4;
    flex-shrink:0;
  }
  .inputbar input{
    flex:1;
    border:none;
    outline:none;
    padding:10px 14px;
    border-radius:22px;
    font-size:14.5px;
    background:#fff;
  }
  .sendbtn{
    width:38px;height:38px;border-radius:50%;
    background:var(--wa-header);
    border:none;
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .sendbtn:disabled{ opacity:.5; }

  .quickchips{
    display:flex; gap:6px; overflow-x:auto;
    padding:0 8px 8px 8px;
    background:#EFEAE4;
  }
  .chip{
    flex-shrink:0;
    background:#fff;
    border:1px solid #d8d2c9;
    color:#075E54;
    font-size:12px;
    padding:6px 11px;
    border-radius:14px;
    cursor:pointer;
  }
  .chip:active{ background:#f0f0f0; }

  .scenariobar{
    max-width:390px;
    margin:0 auto 10px auto;
    color:#c6cdd2;
    font-size:12px;
    text-align:center;
  }
  .chatarea::-webkit-scrollbar{ width:5px; }
  .chatarea::-webkit-scrollbar-thumb{ background:rgba(0,0,0,.15); border-radius:4px; }
</style>
</head>
<body>

<div style="display:flex; flex-direction:column; align-items:center;">
<div class="phone">
  <div class="notch"></div>
  <div class="header">
    <span class="back">&#8592;</span>
    <div class="avatar">MIM</div>
    <div class="header-info">
      <div class="name">MIM · Clínica Dental Juana Jesús</div>
      <div class="status" id="statusline">en línea</div>
    </div>
    <div class="header-icons">
      <span>&#128222;</span>
      <span>&#8942;</span>
    </div>
  </div>

  <div class="chatarea" id="chatarea">
    <div class="daychip">HOY</div>
  </div>

  <div class="quickchips" id="quickchips"></div>

  <div class="inputbar">
    <input type="text" id="msgInput" placeholder="Escribe un mensaje" autocomplete="off">
    <button class="sendbtn" id="sendBtn" aria-label="Enviar">&#10148;</button>
  </div>
</div>
<div class="scenariobar">Demo simulada · guion fijo, sin conexión a IA en vivo</div>
</div>

<script>
const chatarea = document.getElementById('chatarea');
const input = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const statusline = document.getElementById('statusline');
const quickchips = document.getElementById('quickchips');

const SLOTS = [
  'Miércoles 12 de agosto, 10:00',
  'Miércoles 12 de agosto, 17:30',
  'Jueves 13 de agosto, 09:30',
  'Jueves 13 de agosto, 12:00',
  'Viernes 14 de agosto, 11:00'
];

let state = { step:'ask_name', name:'', chosenSlot:'', cancelTarget:'' };

function timeNow(){
  return new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
}

function scrollToBottom(){ chatarea.scrollTop = chatarea.scrollHeight; }

function addBubble(text, who){
  const row = document.createElement('div');
  row.className = 'bubble-row ' + (who === 'out' ? 'out' : 'in');
  const b = document.createElement('div');
  b.className = 'bubble ' + (who === 'out' ? 'out' : 'in');
  b.textContent = text;
  const meta = document.createElement('span');
  meta.className = 'meta';
  meta.innerHTML = timeNow() + (who === 'out' ? '<span class="tick">&#10003;&#10003;</span>' : '');
  b.appendChild(meta);
  row.appendChild(b);
  chatarea.appendChild(row);
  scrollToBottom();
}

function addSysNote(text){
  const el = document.createElement('div');
  el.className = 'sysnote';
  el.textContent = text;
  chatarea.appendChild(el);
  scrollToBottom();
}

function showTyping(){
  const row = document.createElement('div');
  row.className = 'bubble-row in';
  row.id = 'typingRow';
  const t = document.createElement('div');
  t.className = 'typing';
  t.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(t);
  chatarea.appendChild(row);
  scrollToBottom();
}

function hideTyping(){
  const t = document.getElementById('typingRow');
  if(t) t.remove();
}

function setChips(list){
  quickchips.innerHTML = '';
  list.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = c.label;
    chip.addEventListener('click', () => sendMessage(c.value !== undefined ? c.value : c.label));
    quickchips.appendChild(chip);
  });
}

function extractName(text){
  const t = text.trim().replace(/^me llamo\s+/i,'').replace(/^soy\s+/i,'');
  return t.split(' ').filter(Boolean).slice(0,4).map(w => w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');
}

function matches(text, words){
  const t = text.toLowerCase();
  return words.some(w => t.includes(w));
}

async function botReply(userText){
  const t = userText.trim();

  if(state.step === 'ask_name'){
    state.name = extractName(t) || 'Paciente';
    state.step = 'menu';
    addSysNote('Ficha buscada en Google Drive → no existe → se crea nueva ficha para ' + state.name);
    setChips([
      {label:'Pedir cita'},
      {label:'Ver disponibilidad'},
      {label:'Cancelar cita'},
      {label:'Precio implante'}
    ]);
    return `¡Encantada, ${state.name}! 😊 ¿En qué puedo ayudarte? Puedo darte información, reservar cita o cancelar una cita existente.`;
  }

  if(matches(t, ['cancelar'])){
    state.step = 'cancel_ask_date';
    setChips([]);
    return `Claro, ${state.name}. ¿Me confirmas el día y la hora de la cita que quieres cancelar?`;
  }

  if(state.step === 'cancel_ask_date'){
    state.cancelTarget = t;
    state.step = 'cancel_confirm';
    setChips([{label:'Sí, cancelar'}, {label:'No, mantenerla'}]);
    return `¿Confirmas que quieres cancelar tu cita del ${t}?`;
  }

  if(state.step === 'cancel_confirm'){
    if(matches(t, ['sí','si','confirmo','cancelar'])){
      addSysNote('Cancelar Cita en Calendario (Google Calendar) → delete: event');
      state.step = 'menu';
      setChips([
        {label:'Ver disponibilidad'},
        {label:'Pedir cita'}
      ]);
      return `Hecho, ${state.name}. Tu cita del ${state.cancelTarget} ha sido cancelada. ¿Quieres que te busque un nuevo hueco?`;
    } else {
      state.step = 'menu';
      setChips([{label:'Pedir cita'},{label:'Ver disponibilidad'},{label:'Cancelar cita'},{label:'Precio implante'}]);
      return `Perfecto, dejo tu cita del ${state.cancelTarget} tal cual está. ¿Necesitas algo más?`;
    }
  }

  if(matches(t, ['disponibilidad','huecos','horarios libres','cuándo tenéis','cuando teneis'])){
    addSysNote('Consultar Disponibilidad (Google Calendar) → getAll: event');
    state.step = 'choose_slot';
    setChips(SLOTS.map(s => ({label:s})));
    return `Estos son los próximos huecos libres, ${state.name}:\n\n• ${SLOTS.slice(0,3).join('\n• ')}\n\n¿Te viene bien alguno?`;
  }

  if(matches(t, ['pedir cita','quiero cita','reservar','coger cita','pedir una cita'])){
    addSysNote('Consultar Disponibilidad (Google Calendar) → getAll: event');
    state.step = 'choose_slot';
    setChips(SLOTS.map(s => ({label:s})));
    return `Con gusto, ${state.name}. Tengo estos huecos disponibles:\n\n• ${SLOTS.slice(0,3).join('\n• ')}\n\n¿Cuál te viene mejor?`;
  }

  if(state.step === 'choose_slot' && SLOTS.some(s => t.includes(s.split(',')[0]) || t === s)){
    const slot = SLOTS.find(s => t.includes(s.split(',')[0]) || t === s) || t;
    state.chosenSlot = slot;
    state.step = 'confirm_slot';
    setChips([{label:'Confirmar'}, {label:'Elegir otro'}]);
    return `Perfecto, te reservo el ${slot} para revisión. ¿Confirmas la cita?`;
  }

  if(state.step === 'confirm_slot'){
    if(matches(t, ['confirmar','sí','si','vale','confirmo'])){
      addSysNote('Crear Cita en Calendario (Google Calendar) → create: event\nFicha actualizada en Google Drive');
      state.step = 'menu';
      setChips([{label:'Ver disponibilidad'},{label:'Cancelar cita'}]);
      return `Cita confirmada, ${state.name} ✅ Te espero el ${state.chosenSlot} en C/ Tartessos 5, Los Corrales. Te lo he anotado en tu ficha. ¿Algo más?`;
    } else {
      state.step = 'choose_slot';
      setChips(SLOTS.map(s => ({label:s})));
      return `Sin problema, ¿cuál de estos te viene mejor?\n\n• ${SLOTS.join('\n• ')}`;
    }
  }

  if(matches(t, ['precio','cuesta','coste','tarifa'])){
    state.step = 'menu';
    setChips([{label:'Pedir cita de valoración'},{label:'Ver disponibilidad'}]);
    return `El presupuesto depende de cada caso, así que la Dra. Juana Jesús hace una valoración personalizada en consulta. ¿Quieres que te reserve una cita de valoración, ${state.name}?`;
  }

  if(matches(t, ['pedir cita de valoración','cita de valoracion','cita de valoración'])){
    addSysNote('Consultar Disponibilidad (Google Calendar) → getAll: event');
    state.step = 'choose_slot';
    setChips(SLOTS.map(s => ({label:s})));
    return `Estos son los próximos huecos disponibles para tu valoración:\n\n• ${SLOTS.slice(0,3).join('\n• ')}`;
  }

  setChips([{label:'Pedir cita'},{label:'Ver disponibilidad'},{label:'Cancelar cita'},{label:'Precio implante'}]);
  return `Puedo ayudarte a reservar cita, consultar horarios disponibles, cancelar una cita o resolver dudas sobre nuestros servicios, ${state.name}. ¿Qué necesitas?`;
}

async function sendMessage(text){
  if(!text || !text.trim()) return;
  input.value = '';
  sendBtn.disabled = true;

  addBubble(text, 'out');
  statusline.textContent = 'escribiendo…';
  showTyping();

  await new Promise(r => setTimeout(r, 700 + Math.random()*500));
  const reply = await botReply(text);

  hideTyping();
  addBubble(reply, 'in');
  statusline.textContent = 'en línea';
  sendBtn.disabled = false;
}

sendBtn.addEventListener('click', () => sendMessage(input.value));
input.addEventListener('keydown', (e) => { if(e.key === 'Enter') sendMessage(input.value); });

setTimeout(() => {
  showTyping();
  setTimeout(() => {
    hideTyping();
    addBubble('¡Hola! 😊 Soy MIM, el asistente de Clínica Dental Juana Jesús. Para poder ayudarte, ¿me dices tu nombre y apellidos completos?', 'in');
  }, 900);
}, 500);
</script>

</body>
</html>
